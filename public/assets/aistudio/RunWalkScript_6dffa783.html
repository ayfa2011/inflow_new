<style>
  /* Run Walk Specific CSS */
  .run-module {
    background: #ffffff;
    border-radius: 20px;
    padding: 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    margin-top: 15px;
  }

  .today-run-hero {
    background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    margin-bottom: 20px;
  }

  .today-badge {
    font-size: 13px;
    font-weight: 700;
    color: #1e40af;
    margin-bottom: 8px;
  }

  .today-distance {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 4px;
    margin: 8px 0;
  }

  .km-number {
    font-size: 42px;
    font-weight: 900;
    color: #1e3a8a;
  }

  .km-unit {
    font-size: 18px;
    font-weight: 800;
    color: #3b82f6;
  }

  .today-status {
    font-size: 14px;
    font-weight: 700;
    color: #1d4ed8;
    margin-bottom: 16px;
  }

  .today-quick-edit {
    background: rgba(255, 255, 255, 0.8);
    padding: 12px;
    border-radius: 12px;
    backdrop-filter: blur(4px);
  }

  #quickKmForm {
    display: flex;
    gap: 8px;
    justify-content: center;
    align-items: center;
  }

  #quickKmInput {
    width: 120px;
    padding: 8px 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    outline: none;
  }

  .primary-btn {
    background: #2563eb;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
  }

  .averages-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }

  .avg-card {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 10px 6px;
    text-align: center;
  }

  .avg-card span {
    display: block;
    font-size: 10px;
    font-weight: 700;
    color: #64748b;
  }

  .avg-card strong {
    display: block;
    font-size: 18px;
    font-weight: 900;
    color: #0f172a;
    margin: 2px 0;
  }

  .avg-card small {
    font-size: 9px;
    color: #94a3b8;
  }

  .history-section {
    margin-bottom: 20px;
  }

  .section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .section-title h3 {
    font-size: 16px;
    font-weight: 800;
  }

  .days-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .day-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    background: #f8fafc;
    border-radius: 10px;
  }

  .day-row.is-today {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
  }

  .day-info b {
    display: block;
    font-size: 13px;
  }

  .day-info small {
    font-size: 11px;
    color: #64748b;
  }

  .day-stats {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .day-edit-btn {
    background: #e2e8f0;
    border: none;
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }

  .entry-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    border-bottom: 1px solid #f1f5f9;
  }
</style>

<script>
// Run Walk Module Configuration Object
const runWalkConfig = {
  id: 'run-walk',
  label: 'Run Walk',
  icon: '🏃',
  group: 'Activity',
  fields: [
    { key: 'km', label: 'Distance (KM)', type: 'number', step: '0.1', required: true, placeholder: 'ಉದಾ: 5.7' },
    { key: 'date', label: 'Date', type: 'date', required: true },
    { key: 'duration', label: 'Duration (Minutes)', type: 'number', required: false, placeholder: 'ಉದಾ: 40' },
    { key: 'notes', label: 'Notes (Optional)', type: 'text', required: false, placeholder: 'ಉದಾ: ಮಾರ್ನಿಂಗ್ ವಾಕ್' }
  ],
  render(entries, helpers) {
    const todayStr = helpers ? helpers.date() : new Date().toISOString().split('T')[0];
    const now = new Date();
    
    const kannadaDays = ['ಭಾನುವಾರ', 'ಸೋಮವಾರ', 'ಮಂಗಳವಾರ', 'ಬುಧವಾರ', 'ಗುರುವಾರ', 'ಶುಕ್ರವಾರ', 'ಶನಿವಾರ'];
    const kannadaMonths = ['ಜನವರಿ', 'ಫೆಬ್ರವರಿ', 'ಮಾರ್ಚ್', 'ಏಪ್ರಿಲ್', 'ಮೇ', 'ಜೂನ್', 'ಜುಲೈ', 'ಆಗಸ್ಟ್', 'ಸೆಪ್ಟೆಂಬರ್', 'ಅಕ್ಟೋಬರ್', 'ನವೆಂಬರ್', 'ಡಿಸೆಂಬರ್'];

    const todayDayName = kannadaDays[now.getDay()];
    const todayFormatted = `${now.getDate()} ${kannadaMonths[now.getMonth()]} ${now.getFullYear()}`;

    const todayEntries = entries.filter(x => x.date === todayStr);
    const todayKm = todayEntries.reduce((s, x) => s + Number(x.km || 0), 0);
    const todayEntry = todayEntries[0] || null;

    const parseDateStr = (str) => {
      const parts = (str || '').split('-');
      if (parts.length === 3) {
        return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      }
      return new Date(str);
    };

    // 2. Averages
    const sevenDaysAgo = new Date();
    sevenDaysAgo.setDate(now.getDate() - 6);
    sevenDaysAgo.setHours(0, 0, 0, 0);

    const past7DaysEntries = entries.filter(x => {
      const d = parseDateStr(x.date);
      return d >= sevenDaysAgo && d <= now;
    });
    const past7Km = past7DaysEntries.reduce((s, x) => s + Number(x.km || 0), 0);
    const weeklyAvg = past7Km / 7;

    const thirtyDaysAgo = new Date();
    thirtyDaysAgo.setDate(now.getDate() - 29);
    thirtyDaysAgo.setHours(0, 0, 0, 0);

    const past30DaysEntries = entries.filter(x => {
      const d = parseDateStr(x.date);
      return d >= thirtyDaysAgo && d <= now;
    });
    const past30Km = past30DaysEntries.reduce((s, x) => s + Number(x.km || 0), 0);
    const monthlyAvg = past30Km / 30;

    const startOfYear = new Date(now.getFullYear(), 0, 1);
    const daysElapsedInYear = Math.max(1, Math.floor((now - startOfYear) / (1000 * 60 * 60 * 24)) + 1);
    const thisYearEntries = entries.filter(x => {
      const d = parseDateStr(x.date);
      return d.getFullYear() === now.getFullYear();
    });
    const thisYearKm = thisYearEntries.reduce((s, x) => s + Number(x.km || 0), 0);
    const yearlyAvg = thisYearKm / daysElapsedInYear;

    // 3. 1-Week History
    const weekHistory = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date();
      d.setDate(now.getDate() - i);
      const pad = n => String(n).padStart(2, '0');
      const dStr = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      const dayName = kannadaDays[d.getDay()];
      const formatted = `${d.getDate()} ${kannadaMonths[d.getMonth()]}`;
      const dayMatches = entries.filter(x => x.date === dStr);
      const km = dayMatches.reduce((s, x) => s + Number(x.km || 0), 0);
      const primaryEntry = dayMatches[0] || null;
      weekHistory.push({
        dateStr: dStr,
        dayName,
        formatted,
        km,
        entryId: primaryEntry?.id || null,
        isToday: i === 0
      });
    }

    const weekDateSet = new Set(weekHistory.map(w => w.dateStr));
    const olderEntries = entries.filter(x => !weekDateSet.has(x.date)).sort((a, b) => (b.date || '').localeCompare(a.date || ''));

    const esc = helpers ? helpers.esc : (str => str || '');

    return `
      <div class="run-module">
        <button onclick="backToDashboard()" style="margin-bottom:12px; background:none; border:none; color:#2563eb; font-weight:800; cursor:pointer;">
          ← Back to Dashboard
        </button>

        <div class="today-run-hero">
          <div class="today-badge">📅 ಇವತ್ತು · ${todayDayName}, ${todayFormatted}</div>
          <div class="today-distance">
            <span class="km-number" id="todayKmDisplay">${todayKm.toFixed(1)}</span>
            <span class="km-unit">KM</span>
          </div>
          <p class="today-status">
            ${todayKm > 0 ? (todayKm >= 5 ? 'ಇಂದಿನ ಗುರಿ ಮುಗಿದಿದೆ 🎉' : `ಇಂದಿನ ಓಟ: ${todayKm.toFixed(1)} KM`) : 'ಇವತ್ತು ಇನ್ನೂ ಓಟ ದಾಖಲಾಗಿಲ್ಲ'}
          </p>

          <div class="today-quick-edit">
            <span style="font-size:12px; font-weight:700; color:#64748b; display:block; margin-bottom:6px;">
              ಇವತ್ತಿನ KM ತಿದ್ದುಪಡಿ / ಸೇರಿಸಿ (Quick Edit):
            </span>
            <form id="quickKmForm" onsubmit="saveQuickKm(event)">
              <input 
                type="number" 
                step="0.1" 
                min="0" 
                max="100" 
                id="quickKmInput" 
                value="${todayKm > 0 ? todayKm : ''}" 
                placeholder="KM (ಉದಾ: 5)" 
                required 
              />
              <button type="submit" class="primary-btn">
                💾 Save
              </button>
            </form>
          </div>
        </div>

        <div>
          <div style="font-size:13px; font-weight:700; color:#64748b; margin:4px 2px 8px;">
            📊 Averages
          </div>
          <div class="averages-grid">
            <div class="avg-card">
              <span>Weekly Average</span>
              <strong>${weeklyAvg.toFixed(1)}</strong>
              <small>KM / Day</small>
            </div>
            <div class="avg-card">
              <span>Monthly Average</span>
              <strong>${monthlyAvg.toFixed(1)}</strong>
              <small>KM / Day</small>
            </div>
            <div class="avg-card">
              <span>Yearly Average</span>
              <strong>${yearlyAvg.toFixed(1)}</strong>
              <small>KM / Day</small>
            </div>
          </div>
        </div>

        <div class="history-section">
          <div class="section-title">
            <h3>7 Days History</h3>
            <small>${weekHistory[6].formatted} - ${weekHistory[0].formatted}</small>
          </div>
          <div class="days-list">
            ${weekHistory.map(day => `
              <div class="day-row ${day.isToday ? 'is-today' : ''}">
                <div class="day-info">
                  <b>${day.dayName}${day.isToday ? '<span style="color:#2563eb; font-size:11px;">(ಇವತ್ತು)</span>' : ''}</b>
                  <small>${day.formatted} ·${day.dateStr}</small>
                </div>
                <div class="day-stats">
                  <strong>${day.km > 0 ? `${day.km.toFixed(1)} KM` : '<span style="color:#94a3b8; font-size:13px; font-weight:normal;">0.0 KM</span>'}</strong>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    `;
  }
};

// ಸಾಂಪ್ಲರ್ ಡೇಟಾ ಮತ್ತು ಲೋಡಿಂಗ್ ಫಂಕ್ಷನ್‌ಗಳು
let sampleRunEntries = [
  { id: '1', date: new Date().toISOString().split('T')[0], km: 4.5, duration: 30, notes: 'Morning walk' }
];

function loadRunWalkModule() {
  const html = runWalkConfig.render(sampleRunEntries, {
    date: () => new Date().toISOString().split('T')[0],
    esc: str => str || ''
  });
  document.getElementById('app').innerHTML = html;
}

function saveQuickKm(e) {
  e.preventDefault();
  const kmVal = document.getElementById('quickKmInput').value;
  const todayStr = new Date().toISOString().split('T')[0];
  
  // local update
  sampleRunEntries.push({
    id: Date.now().toString(),
    date: todayStr,
    km: parseFloat(kmVal)
  });

  // Google Sheet ಗೆ ಸೇವ್ ಮಾಡಲು ಸರ್ವರ್ ಕಾಲ್
  google.script.run
    .withSuccessHandler(() => {
      alert("KM ಯಶಸ್ವಿಯಾಗಿ Google Sheet ಗೆ ಸೇವ್ ಆಗಿದೆ!");
      loadRunWalkModule();
    })
    .saveDataToSheet("RunWalk_Data", { date: todayStr, km: kmVal });
}

function backToDashboard() {
  location.reload(); // ಅಥವಾ ಡ್ಯಾಶ್‌ಬೋರ್ಡ್ ತೆರೆಯುವ ಫಂಕ್ಷನ್
}
</script>

<style>
    #skillImproveApp {
      display: none;
      font-family: sans-serif;
      min-height: 100vh;
      width: calc(100% - 12px);
      margin: 0 auto;
      padding: 10px 0 16px;
      box-sizing: border-box;
    }
    #skillCardsContainer {
      max-height: calc(100vh - 160px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 20px;
    }
    .sk-card {
      background: #fff;
      border: 1px solid #e5e3f3;
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 10px;
      touch-action: manipulation;
    }
    .sk-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sk-card-top {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) auto;
      align-items: center;
      column-gap: 8px;
      width: 100%;
    }
    .sk-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .sk-actions .sk-btn {
      width: 36px; height: 36px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .sk-action-menu { display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:10000; justify-content:center; align-items:center; }
    .sk-action-box { background:#fff; width:82%; max-width:300px; padding:18px; border-radius:18px; box-shadow:0 12px 35px rgba(0,0,0,.18); }
    .sk-action-box button { width:100%; margin-top:8px; }
    .sk-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .sk-actions .sk-btn {
      flex: 0 0 auto;
    }
    @media (max-width: 520px) {
      #skillImproveApp {
        width: calc(100% - 14px);
      }
      .sk-card {
        padding: 10px;
      }
      .sk-main { min-width: 0; }
      .sk-card-top { grid-template-columns: 34px minmax(0, 1fr) auto; column-gap: 7px; }
      .sk-actions { gap: 4px; }
      .sk-actions .sk-btn { width: 34px; height: 34px; }
      .sk-view { padding: 7px 8px; font-size: 11px; }
    }
    .sk-num {
      background: #f1eff9;
      color: #6b6890;
      font-weight: 800;
      font-size: 12px;
      padding: 6px 8px;
      border-radius: 8px;
    }
    .sk-main {
      flex: 1;
      min-width: 140px;
    }
    .sk-k {
      font-size: 15px;
      font-weight: 600;
      color: #1e1b4b;
    }
    .sk-cat {
      font-size: 11px;
      color: #777;
    }
    .sk-btn {
      border: 1px solid #ddd;
      background: #f4f3fb;
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
      font-size: 14px;
    }
    .sk-view {
      background: #efe7ff;
      border-color: #d6c5fb;
      color: #5b2a9e;
      font-weight: 700;
      font-size: 12px;
      white-space: nowrap;
    }
    .sk-view.on {
      background: #fde8e8;
      border-color: #f5b5b5;
      color: #c0262d;
    }
    .sk-ans {
      display: none;
      margin-top: 10px;
      background: #f0edff;
      border: 1px solid #d9d3fa;
      border-radius: 12px;
      padding: 12px;
    }
    .sk-ans .r {
      font-size: 18px;
      font-weight: 800;
      color: #1e1b4b;
    }
    .sk-ans .d {
      font-size: 13px;
      color: #6b6890;
      font-style: italic;
      margin-top: 4px;
    }
    .sk-in {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin-bottom: 10px;
      box-sizing: border-box;
      font-size: 14px;
    }
  </style>

<div id="skillImproveApp">
  <div class="sk-row" style="margin-bottom:14px;">
    <button class="sk-btn" onclick="goBackFromSkill()" style="color:#4f46e5;font-weight:700;">← Back</button>
    <div style="flex:1;text-align:center;font-weight:900;font-size:20px;color:#1e1b4b;">🗣️ Skill Improve</div>
    <button class="sk-btn" onclick="openAddSkillModal()" style="background:#4f46e5;color:#fff;font-weight:800;">+</button>
  </div>

  <div class="sk-row" style="margin-bottom:12px;">
    <select id="skFilter" onchange="applySkFilter()" class="sk-btn"><option value="">All</option></select>
    <button class="sk-btn" onclick="skAll(true)">👁️ Reveal All</button>
    <button class="sk-btn" onclick="skAll(false)">🙈 Hide All</button>
    <span id="skCount" style="font-size:12px;color:#777;margin-left:auto;"></span>
  </div>

  <div style="font-size:12px;font-weight:800;color:#8a87a8;display:flex;justify-content:space-between;margin-bottom:8px;">
    <span>SL NO &amp; ಕನ್ನಡ ವಾಕ್ಯ (SENTENCE)</span><span>ಉತ್ತರ / ACTION</span>
  </div>
  <div id="skillCardsContainer">Loading...</div>
</div>

<div id="skillActionModal" class="sk-action-menu">
  <div class="sk-action-box">
    <div style="font-weight:900;font-size:18px;color:#1e1b4b;margin-bottom:6px;">Sentence Options</div>
    <button class="sk-btn" style="background:#4f46e5;color:#fff;font-weight:800;" onclick="editFromActionMenu()">✏️ Edit</button>
    <button class="sk-btn" style="color:#c0262d;font-weight:800;" onclick="deleteFromActionMenu()">🗑️ Delete</button>
    <button class="sk-btn" onclick="closeSkillActionMenu()">Cancel</button>
  </div>
</div>

<div id="skillModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;justify-content:center;align-items:center;">
  <div style="background:#fff;width:90%;max-width:400px;padding:20px;border-radius:18px;">
    <h3 id="skModalTitle" style="margin-top:0;">Add New Sentence</h3>
    <input id="skCat" class="sk-in" placeholder="Category (Greetings, Food...)" list="skCatList">
    <datalist id="skCatList"></datalist>
    <input id="skKan" class="sk-in" placeholder="Kannada sentence (Roman)">
    <input id="skRom" class="sk-in" placeholder="Hindi (Roman) - Aap kaise hain?">
    <input id="skDev" class="sk-in" placeholder="Hindi (Devanagari) - for voice">
    <div class="sk-row">
      <button class="sk-btn" style="flex:1" onclick="closeAddSkillModal()">Cancel</button>
      <button class="sk-btn" style="flex:1;background:#4f46e5;color:#fff;" onclick="saveSkillItem()">Save</button>
    </div>
  </div>
</div>

<script>
var skData = [], skEditRow = null, skActionIndex = null;

window.addEventListener('load', function() {
  loadSkillTrackerData();
});

function loadSkillTrackerData() {
  google.script.run
    .withSuccessHandler(function (d) { skData = d; buildFilter(); renderSkillCards(); })
    .withFailureHandler(function (e) { document.getElementById('skillCardsContainer').innerHTML = 'Error: ' + e.message; })
    .getSkillTrackerData();
}

function esc(t) { return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function buildFilter() {
  var cats = [], f = document.getElementById('skFilter'), cur = f.value;
  skData.forEach(function (x) { if (cats.indexOf(x.category) < 0) cats.push(x.category); });
  f.innerHTML = '<option value="">All</option>' + cats.map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('');
  f.value = cur;
  document.getElementById('skCatList').innerHTML = cats.map(function (c) { return '<option value="' + esc(c) + '">'; }).join('');
}

function applySkFilter() { renderSkillCards(); }

function renderSkillCards(preloaded) {
  if (Array.isArray(preloaded) && preloaded.length) { skData = preloaded; buildFilter(); }
  var f = document.getElementById('skFilter').value, html = '', n = 0;
  skData.forEach(function (x, i) {
    if (f && x.category !== f) return;
    n++;
    html += '<div class="sk-card"><div class="sk-card-top">' +
      '<span class="sk-num">' + String(i + 1).padStart(2, '0') + '</span>' +
      '<div class="sk-main"><div class="sk-k">' + esc(x.kannada) + '</div><div class="sk-cat">' + esc(x.category) + '</div></div>' +
      '<div class="sk-actions">' +
      '<button id="btn_' + i + '" class="sk-btn sk-view" onclick="toggleAnswer(' + i + ')">👀 View Hindi</button>' +
      '<button class="sk-btn" onclick="speakHindi(' + i + ')">🔊</button>' +
      '<button class="sk-btn" onclick="openActionMenu(' + i + ')">✏️</button>' +
      '</div></div>' +
      '<div id="ans_' + i + '" class="sk-ans"><div class="r">' + esc(x.roman) + '</div>' +
      '<div class="d">' + esc(x.deva) + '</div></div></div>';
  });
  document.getElementById('skillCardsContainer').innerHTML = html || 'No sentences found.';
  document.getElementById('skCount').textContent = n + ' sentences';
}

function setOpen(i, open) {
  var a = document.getElementById('ans_' + i), b = document.getElementById('btn_' + i);
  if (!a) return;
  a.style.display = open ? 'block' : 'none';
  b.textContent = open ? '🙈 Hide' : '👀 View Hindi';
  b.className = 'sk-btn sk-view' + (open ? ' on' : '');
}

function toggleAnswer(i) { setOpen(i, document.getElementById('ans_' + i).style.display === 'none'); }
function skAll(open) { skData.forEach(function (x, i) { setOpen(i, open); }); }

function goBackFromSkill() {
  if (typeof switchView === 'function') {
    switchView('dashboardView');
    return;
  }
  var skillView = document.getElementById('skillImproveApp');
  if (skillView) skillView.style.display = 'none';
  var dashboard = document.getElementById('dashboardView');
  if (dashboard) dashboard.style.display = 'block';
}

function speakHindi(i) {
  var x = skData[i];
  if (!window.speechSynthesis) { 
    alert('Voice not supported in this browser'); 
    return; 
  }
  
  speechSynthesis.cancel();
  
  var textToSpeak = x.deva || x.roman;
  var u = new SpeechSynthesisUtterance(textToSpeak);
  
  u.lang = 'hi-IN';
  u.rate = 0.75; // Slow & clear human voice speed
  u.pitch = 1.0;

  var voices = speechSynthesis.getVoices();
  var hindiVoices = voices.filter(function(v) {
    var lang = (v.lang || '').replace('_', '-').toLowerCase();
    return lang === 'hi-in' || lang.indexOf('hi-') === 0 || lang === 'hi';
  });

  // Prefer known male Hindi voices when the device/browser provides one.
  var maleNames = ['madhur','hemant','ravi','amit','rahul','male','deepak','ajay','arjun'];
  var hindiVoice = hindiVoices.find(function(v) {
    var name = (v.name || '').toLowerCase();
    return maleNames.some(function(k) { return name.indexOf(k) >= 0; });
  });
  if (!hindiVoice) {
    hindiVoice = hindiVoices.find(function(v) {
      return (v.lang || '').replace('_','-').toLowerCase() === 'hi-in';
    }) || hindiVoices[0];
  }
  if (hindiVoice) u.voice = hindiVoice;
  u.pitch = 0.72;

  speechSynthesis.speak(u);
}

function openAddSkillModal() {
  skEditRow = null;
  document.getElementById('skModalTitle').textContent = 'Add New Sentence';
  ['skKan','skRom','skDev'].forEach(function (id) { document.getElementById(id).value = ''; });
  document.getElementById('skCat').value = document.getElementById('skFilter').value;
  document.getElementById('skillModal').style.display = 'flex';
}

function openActionMenu(i) {
  skActionIndex = i;
  document.getElementById('skillActionModal').style.display = 'flex';
}

function closeSkillActionMenu() {
  document.getElementById('skillActionModal').style.display = 'none';
  skActionIndex = null;
}

function editFromActionMenu() {
  var i = skActionIndex;
  closeSkillActionMenu();
  if (i !== null) openEdit(i);
}

function deleteFromActionMenu() {
  var i = skActionIndex;
  closeSkillActionMenu();
  if (i !== null) delItem(i);
}

function openEdit(i) {
  var x = skData[i]; skEditRow = x.row;
  document.getElementById('skModalTitle').textContent = 'Edit Sentence';
  document.getElementById('skCat').value = x.category;
  document.getElementById('skKan').value = x.kannada;
  document.getElementById('skRom').value = x.roman;
  document.getElementById('skDev').value = x.deva;
  document.getElementById('skillModal').style.display = 'flex';
}

function closeAddSkillModal() { document.getElementById('skillModal').style.display = 'none'; }

function saveSkillItem() {
  var c = document.getElementById('skCat').value.trim() || 'General Talk',
      k = document.getElementById('skKan').value.trim(),
      r = document.getElementById('skRom').value.trim(),
      d = document.getElementById('skDev').value.trim();
  if (!k || !r) { alert('Kannada mattu Hindi (Roman) mandatory!'); return; }
  var run = google.script.run
    .withSuccessHandler(function (d2) { skData = d2; closeAddSkillModal(); buildFilter(); renderSkillCards(); })
    .withFailureHandler(function (e) { alert('Error: ' + e.message); });
  if (skEditRow) run.updateSkillItem(skEditRow, c, k, r, d); else run.saveNewSkillItem(c, k, r, d);
}

function delItem(i) {
  if (!confirm('Delete this sentence?')) return;
  google.script.run
    .withSuccessHandler(function (d) { skData = d; buildFilter(); renderSkillCards(); })
    .withFailureHandler(function (e) { alert('Error: ' + e.message); })
    .deleteSkillItem(skData[i].row);
}
</script>

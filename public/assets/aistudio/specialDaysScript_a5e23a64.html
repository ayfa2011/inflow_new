<script>
  function fetchSpecialDaysDataFromSheet() {
    var container = document.getElementById('specialDaysList');
    if (container) container.innerHTML = '<div style="text-align: center; padding: 20px; color: #666;">Loading...</div>';

    google.script.run
      .withSuccessHandler(function(response) {
        processAndRenderSpecialDays(response);
      })
      .withFailureHandler(function(err) {
        if (container) container.innerHTML = '<div style="color: red; text-align: center;">Error loading data: ' + err.message + '</div>';
      })
      .getSpecialDaysData();
  }

  // Calculate days remaining and sort chronologically
  function calculateDaysLeft(dateStr) {
    if (!dateStr) return 999;
    var today = new Date();
    today.setHours(0, 0, 0, 0);

    var parts = dateStr.split('-'); // Expected format: YYYY-MM-DD
    if (parts.length !== 3) return 999;

    var month = parseInt(parts[1], 10) - 1;
    var day = parseInt(parts[2], 10);

    var targetDate = new Date(today.getFullYear(), month, day);
    targetDate.setHours(0, 0, 0, 0);

    if (targetDate < today) {
      targetDate.setFullYear(today.getFullYear() + 1); // Look forward to next year if passed
    }

    var diffTime = targetDate - today;
    var diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
    return diffDays;
  }

  function formatDateReadable(dateStr) {
    if (!dateStr) return '';
    var parts = dateStr.split('-');
    if (parts.length !== 3) return dateStr;
    var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var mIndex = parseInt(parts[1], 10) - 1;
    return months[mIndex] + ' ' + parseInt(parts[2], 10);
  }

  function processAndRenderSpecialDays(items) {
    var container = document.getElementById('specialDaysList');
    var reminderBanner = document.getElementById('specialDaysReminderBanner');
    if (!container) return;

    if (!items || items.length === 0) {
      container.innerHTML = '<div style="background: #fff; padding: 20px; text-align: center; border-radius: 12px; color: #666;">No Special Days added yet. Click "+ Add New" to create one.</div>';
      if (reminderBanner) reminderBanner.style.display = 'none';
      return;
    }

    // Attach calculated days left and sort items chronologically
    items.forEach(function(item) {
      item.daysLeft = calculateDaysLeft(item.dateStr);
    });

    items.sort(function(a, b) {
      return a.daysLeft - b.daysLeft;
    });

    var reminders = [];
    var html = "";

    items.forEach(function(item, index) {
      var badgeColor = item.daysLeft === 0 ? '#e74c3c' : (item.daysLeft <= 3 ? '#e67e22' : '#1a73e8');
      var countdownText = item.daysLeft === 0 ? '🔥 Today!' : (item.daysLeft === 1 ? '1 day left' : item.daysLeft + ' days left');

      // Check for 3 days or less reminder
      if (item.daysLeft <= 3 && item.daysLeft >= 0) {
        reminders.push('<b>' + item.title + '</b> (' + item.category + ') is coming up in ' + (item.daysLeft === 0 ? 'today' : item.daysLeft + ' days') + '!');
      }

      var readableDate = formatDateReadable(item.dateStr);

      html += '<div class="history-card" style="border-left: 4px solid ' + badgeColor + ';">' +
                '<div>' +
                  '<div class="day-title">' + (item.title || 'Untitled') + '</div>' +
                  '<div class="day-date">' + readableDate + ' • <b>' + (item.category || 'Event') + '</b></div>' +
                  '<div style="font-size: 11px; font-weight: bold; color: ' + badgeColor + '; margin-top: 3px;">⏳ ' + countdownText + '</div>' +
                '</div>' +
                '<div style="display: flex; align-items: center; gap: 8px;">' +
                  // WhatsApp Button
                  '<button class="btn-action" style="background: #25d366; color: white; border: none; padding: 6px 10px;" onclick="openWhatsAppChat(\'' + (item.phone || '') + '\', \'' + encodeURIComponent(item.title) + '\', \'' + item.category + '\')" title="Wish via WhatsApp">💬</button>' +
                  '<button class="btn-action" onclick="openEditSpecialDayModal(' + item.rowIndex + ', \'' + encodeURIComponent(item.title) + '\', \'' + item.dateStr + '\', \'' + item.category + '\', \'' + (item.phone || '') + '\')">✏️</button>' +
                  '<button class="btn-action" style="color: #e74c3c;" onclick="deleteSpecialDayEntry(' + item.rowIndex + ')">🗑️</button>' +
                '</div>' +
              '</div>';
    });

    container.innerHTML = html;

    // Display Dashboard Reminder Banner if any event is within 3 days
    if (reminderBanner && reminders.length > 0) {
      reminderBanner.innerHTML = '⚠️ <b>Reminders:</b><br>' + reminders.join('<br>');
      reminderBanner.style.display = 'block';
    } else if (reminderBanner) {
      reminderBanner.style.display = 'none';
    }
  }

  function openWhatsAppChat(phone, encTitle, category) {
    var title = decodeURIComponent(encTitle);
    var cleanPhone = phone ? phone.replace(/\D/g, '') : '';
    var message = encodeURIComponent("Wish you a very Happy " + category + ", " + title + "! 🎉 Best wishes!");
    var url = cleanPhone ? "https://wa.me/" + cleanPhone + "?text=" + message : "https://wa.me/?text=" + message;
    window.open(url, '_blank');
  }

  function openAddSpecialDayModal() {
    document.getElementById('specialModalTitle').innerText = "Add Special Day";
    document.getElementById('specialDayRowIndex').value = "";
    document.getElementById('specialTitleInput').value = "";
    document.getElementById('specialDateInput').value = "";
    document.getElementById('specialCategoryInput').value = "Birthday";
    document.getElementById('specialPhoneInput').value = "";
    document.getElementById('specialDayModal').style.display = 'block';
  }

  function openEditSpecialDayModal(rowIndex, encTitle, dateStr, category, phone) {
    document.getElementById('specialModalTitle').innerText = "Edit Special Day";
    document.getElementById('specialDayRowIndex').value = rowIndex;
    document.getElementById('specialTitleInput').value = decodeURIComponent(encTitle);
    document.getElementById('specialDateInput').value = dateStr;
    document.getElementById('specialCategoryInput').value = category;
    document.getElementById('specialPhoneInput').value = phone;
    document.getElementById('specialDayModal').style.display = 'block';
  }

  function closeSpecialDayModal() {
    document.getElementById('specialDayModal').style.display = 'none';
  }

  function saveSpecialDayEntry() {
    var title = document.getElementById('specialTitleInput').value.trim();
    var dateStr = document.getElementById('specialDateInput').value;
    var category = document.getElementById('specialCategoryInput').value;
    var phone = document.getElementById('specialPhoneInput').value.trim();
    var rowIndex = document.getElementById('specialDayRowIndex').value;

    if (!title || !dateStr) {
      alert("Dayavittu Title mattu Date namoodisi!");
      return;
    }

    var payload = {
      rowIndex: rowIndex !== "" ? parseInt(rowIndex) : -1,
      title: title,
      dateStr: dateStr,
      category: category,
      phone: phone
    };

    google.script.run
      .withSuccessHandler(function(updatedItems) {
        closeSpecialDayModal();
        processAndRenderSpecialDays(updatedItems);
      })
      .withFailureHandler(function(err) {
        alert("Error saving: " + err.message);
      })
      .saveSpecialDayToSheet(payload);
  }

  function deleteSpecialDayEntry(rowIndex) {
    if (!confirm("Neevu ee event-annu delete madalu bayasutteera?")) return;

    google.script.run
      .withSuccessHandler(function(updatedItems) {
        processAndRenderSpecialDays(updatedItems);
      })
      .withFailureHandler(function(err) {
        alert("Error deleting: " + err.message);
      })
      .deleteSpecialDayFromSheet(rowIndex);
  }

  function closeSpecialDaysView() {
    document.getElementById('specialDaysDashboardContainer').style.display = 'none';
    document.getElementById('dashboardView').style.display = 'block';
  }
</script>
